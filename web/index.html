<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#244d3d"><title>课间 · CMU Campus Explorer</title><link rel="stylesheet" href="styles.css"></head>
<body>
<header><a class="brand" href="./"><span class="mark">间</span><span>课间 <small>CMU CAMPUS EXPLORER</small></span></a><span class="header-note">Follow your curiosity.</span><select id="term" aria-label="学期"></select></header>
<div class="layout"><aside><div class="aside-label">探索校园 / EXPLORE</div><nav><button class="nav active" data-view="explore">↗ <span>课程探索</span></button><button class="nav" data-view="now">◷ <span>此刻课表</span></button><button class="nav" data-view="following">☆ <span>我的关注</span><b id="follow-count">0</b></button></nav><div class="aside-bottom"><span class="dot"></span> PITTSBURGH, PA<p id="clock">America / New York</p><hr><p>走进一栋楼，<br>发现一种新的可能。</p><button id="import-button">＋ 导入完整课表</button><input type="file" id="import-file" accept="application/json,.json" hidden><small>导入的数据仅保存在本次浏览器会话，刷新页面后需重新导入。</small></div></aside>
<main><section class="intro"><div class="eyebrow">THE CAMPUS IS YOUR CLASSROOM</div><h1 id="heading">下一堂好奇，<em>在哪里？</em></h1><p id="subtitle">从一门课、一间教室，或一位教授开始，探索 CMU。</p></section>
<section class="search-panel"><div class="tabs" role="tablist" aria-label="搜索方式"><button role="tab" aria-selected="true" data-mode="courses">课程 <span>Courses</span></button><button role="tab" aria-selected="false" data-mode="rooms">教室 <span>Rooms</span></button><button role="tab" aria-selected="false" data-mode="professors">教授 <span>Professors</span></button></div><div class="search"><span>⌕</span><input id="query" type="search" placeholder="搜索课号或课程名称，例如 15-112" aria-label="搜索课号或课程名称"><kbd>/</kbd></div><div class="filters"><select id="department" aria-label="院系"><option value="">所有院系</option></select><select id="campus" aria-label="校区"><option value="Pittsburgh">Pittsburgh 校区</option><option value="">所有校区</option></select><span id="result-count" role="status"></span></div></section>
<div id="notice" class="notice"></div><div class="section-heading"><h2 id="list-heading">发现课程</h2><span id="data-status">正在加载官方课表…</span></div><div id="results" class="results"></div><button id="more" hidden>加载更多课程 ↓</button><footer><span>为校园里的好奇心而造。</span><a href="https://enr-apps.as.cmu.edu/open/SOC/SOCServlet" target="_blank" rel="noreferrer">CMU 官方课表 ↗</a></footer></main>
<section id="detail" class="detail" hidden aria-label="排班详情"><button id="close-detail" aria-label="关闭详情">×</button><div id="detail-content"></div></section></div><div id="toast" role="status"></div><script type="module" src="app.js"></script></body></html>
